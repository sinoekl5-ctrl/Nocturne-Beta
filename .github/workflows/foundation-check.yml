name: Foundation checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-check:
    name: Core and foundation checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate required files, license and source pins
        run: python scripts/validate_foundation.py
      - name: Validate aligned engine source pins
        run: python scripts/validate_engine_pins.py
      - name: Run Python validator tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate engine checkout plan (no network)
        run: python scripts/engine/checkout.py --platform Linux --print-plan
      - name: Syntax-check prototype entrypoint
        run: node --check prototype/app.js
      - name: Test dependency-free browser core
        run: npm test
